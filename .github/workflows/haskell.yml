name: Haskell CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master ]

jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macOS-13, windows-2022]
        ghc:
          - "8.8.4"
          - "8.10.7"
          - "9.0.2"
          - "9.2.8"
          - "9.4.8"
          - "9.6.6"
          - "9.8.4"
          - "9.10.1"
          - "9.12.1"

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Cabal and GHC
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}

    - name: Cache Linux/Mac
      uses: actions/cache@v3
      if: ${{ matrix.os != 'windows-latest' }}
      with:
        path: ~/.cabal
        key: -${{ runner.os }}-${{ matrix.ghc }}-build-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}-
        restore-keys: |
          -${{ runner.os }}-${{ matrix.ghc }}-build-
          -${{ runner.os }}-

    - name: Cache Windows
      uses: actions/cache@v3
      if: ${{ matrix.os == 'windows-latest' }}
      with:
        path: C:\sr\
        # path: ~/AppData/Roaming/cabal
        key: -${{ runner.os }}-${{ matrix.ghc }}-build-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}-
        restore-keys: |
          -${{ runner.os }}-${{ matrix.ghc }}-build-
          -${{ runner.os }}-

    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests --enable-benchmarks all

    - name: Build
      run: cabal build --enable-tests --enable-benchmarks all

    - name: Run tests
      run: cabal test all

  stack:
    name: ${{ matrix.os }} / stack ${{ matrix.stack-resolver }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macOS-13, windows-2022]
        stack-resolver:
          - "--resolver nightly"  # stack nightly
          - ""  # stack default
          - "--resolver lts-23.3"  # ghc 9.8.4
          ### 22.43, 22.27, 22.20 Omitted for now
          - "--resolver lts-22.6"  # ghc 9.6.3
          - "--resolver lts-21.25"  # ghc 9.4.8
          - "--resolver lts-21.21"  # ghc 9.4.7
          - "--resolver lts-21.11"  # ghc 9.4.6
          - "--resolver lts-21.7"  # ghc 9.4.5
          - "--resolver lts-20.26"  # ghc 9.2.8
          - "--resolver lts-20.24"  # ghc 9.2.7
          - "--resolver lts-20.12"  # ghc 8.2.6
          - "--resolver lts-20.11"  # ghc 9.2.5
          - "--resolver lts-19.33"  # stack 9.0.2
          - "--resolver lts-18.28"  # stack 8.10.7
          - "--resolver lts-18.8"  # stack 8.10.6
          - "--resolver lts-18.6"  # stack 8.10.4
          - "--resolver lts-17.2"  # stack 8.10.3
          - "--resolver lts-16.31"  # stack 8.8.4
          - "--resolver lts-16.11"  # stack 8.8.3
          - "--resolver lts-15.3"  # stack 8.8.2

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Haskell Stack
      uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-no-global: true

    - name: Cache MacOS
      uses: actions/cache@v3
      if: ${{ matrix.os == 'macOS-latest' }}
      with:
        path: ~/.stack
        key: -${{ runner.os }}-${{ matrix.stack-resolver }}-

    - name: Cache Ubuntu
      uses: actions/cache@v3
      if: ${{ matrix.os == 'ubuntu-latest' }}
      with:
        path: ~/.stack
        key: -${{ runner.os }}-${{ matrix.stack-resolver }}-

    - name: Cache Windows
      uses: actions/cache@v3
      if: ${{ matrix.os == 'windows-latest' }}
      with:
        path: C:\sr\
        # path: ~\AppData\Local\Programs\stack
        key: -${{ runner.os }}-${{ matrix.stack-resolver }}-

    - name: Setup
      run: |
        stack setup ${{ matrix.stack-resolver }}

    - name: Build
      run: |
        stack build ${{ matrix.stack-resolver }} --test --bench --no-run-tests --no-run-benchmarks

    # Running with only one thread to avoid "openBinaryFile: resource busy (file is locked)"
    - name: Test
      run: |
        stack test ${{ matrix.stack-resolver }} -j 1
